<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cobertura de intervalos de confianza</title>
  <!-- Contrato: ver _plantilla.html (tema por ?theme= y postMessage; alto con WIDGET_HEIGHT). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1219; --card: #151c27; --card-2: #1b2431;
      --line: rgba(232,236,242,.12); --text: #e9edf3; --muted: #8b96a8;
      --accent: #e3b058; --accent-soft: rgba(227,176,88,.16);
      --ok: #5fd08a; --err: #e0705f; --info: #7fb2e5;
      --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f7f5f0; --card: #ffffff; --card-2: #efece5;
      --line: rgba(13,18,25,.12); --text: #141a22; --muted: #5b6673;
      --accent: #b8862f; --accent-soft: rgba(184,134,47,.16);
      --ok: #2f9e5b; --err: #c2483a; --info: #2f6fb0;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    body { padding: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .mono { font-family: var(--mono); }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    p.sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    label { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    input[type="range"] { accent-color: var(--accent); width: 100%; }
    select, button { font: inherit; font-family: var(--mono); font-size: 12.5px; color: var(--text); background: var(--card-2);
             border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
    button.primary:hover { color: var(--bg); filter: brightness(1.08); }
    .controles { display: grid; grid-template-columns: 1.3fr 1fr 0.8fr; gap: 12px 16px; align-items: end; margin-bottom: 10px; }
    .controles > div { display: flex; flex-direction: column; gap: 5px; }
    .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .panel { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
    canvas { width: 100%; height: 330px; display: block; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .stat .k { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; }
    .stat .v { font-family: var(--mono); font-size: 15px; }
    .stat .v.acc { color: var(--accent); }
    .stat .v.err { color: var(--err); }
    .nota { margin-top: 12px; font-size: 13px; color: var(--muted); line-height: 1.5; }
    .nota strong { color: var(--text); font-weight: 500; }
    @media (max-width: 560px) {
      .controles { grid-template-columns: 1fr 1fr; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>¿Qué significa «95 % de confianza»?</h1>
    <p class="sub">Cada línea es el IC <span class="mono">ȳ ± t·s/√n</span> de una muestra distinta del mismo proceso. La vertical es el verdadero μ, que en la práctica no conocemos.</p>
    <div class="controles">
      <div>
        <label for="pob">proceso</label>
        <select id="pob">
          <option value="normal">Normal · espesor (μ 50, σ 2.5 µm)</option>
          <option value="expo">Asimétrico · tiempo de atención (media 8 min)</option>
        </select>
      </div>
      <div>
        <label for="n">tamaño de muestra n = <span id="n-v" class="mono">10</span></label>
        <input id="n" type="range" min="3" max="60" step="1" value="10" />
      </div>
      <div>
        <label for="nivel">confianza</label>
        <select id="nivel">
          <option value="0.80">80 %</option>
          <option value="0.90">90 %</option>
          <option value="0.95" selected>95 %</option>
          <option value="0.99">99 %</option>
        </select>
      </div>
    </div>
    <div class="acciones">
      <button id="mas" type="button" class="primary">Tomar 100 muestras más</button>
      <button id="reiniciar" type="button">Reiniciar conteo</button>
    </div>
    <div class="panel"><canvas id="c"></canvas></div>
    <div class="stats">
      <div class="stat"><span class="k">estas 100: contienen μ</span><span class="v acc" id="s-lote">—</span></div>
      <div class="stat"><span class="k">acumulado</span><span class="v" id="s-acum">—</span></div>
      <div class="stat"><span class="k">no contienen μ (acumulado)</span><span class="v err" id="s-fallos">—</span></div>
    </div>
    <p class="nota" id="nota"></p>
  </div>

  <script>
    // --- tema: inicial por ?theme=, en vivo por postMessage ---
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      if (q === "light" || q === "dark") document.documentElement.setAttribute("data-theme", q);
      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (d.type === "THEME_CHANGE" && (d.theme === "light" || d.theme === "dark")) {
          document.documentElement.setAttribute("data-theme", d.theme);
          dibujar();
        }
      });
    })();
    // --- alto real → padre ---
    (function () {
      function avisar() {
        var h = document.documentElement.scrollHeight;
        if (window.parent !== window) window.parent.postMessage({ type: "WIDGET_HEIGHT", height: h }, "*");
      }
      window.addEventListener("load", avisar);
      if (window.ResizeObserver) new ResizeObserver(avisar).observe(document.body);
    })();

    // --- distribuciones (t por integración sobre la χ²; verificado contra qt() de R) ---
    function lgamma(x) {
      var g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
        -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
      if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgamma(1 - x);
      x -= 1;
      var a = c[0], t = x + g + 0.5;
      for (var i = 1; i < g + 2; i++) a += c[i] / (x + i);
      return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
    }
    function pnorm(z) {
      var x = Math.abs(z) / Math.SQRT2, t = 1 / (1 + 0.5 * x);
      var y = t * Math.exp(-x * x - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 +
        t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
      return z >= 0 ? 1 - y / 2 : y / 2;
    }
    var cteChi = {};
    function dchiEsc(s, df) {
      if (s <= 0) return 0;
      var h = df / 2;
      if (cteChi[df] === undefined) cteChi[df] = h * Math.log(df) - (h - 1) * Math.log(2) - lgamma(h);
      return Math.exp(cteChi[df] + (df - 1) * Math.log(s) - df * s * s / 2);
    }
    function colaT(c, df) {
      // s = √(V/gl) se concentra en 1 con desviación ≈ 1/√(2·gl).
      var de = 1 / Math.sqrt(2 * df), a = Math.max(0, 1 - 10 * de), N = 400, h = (1 + 12 * de - a) / N, suma = 0;
      for (var i = 0; i <= N; i++) {
        var s = a + i * h, w = (i === 0 || i === N) ? 1 : (i % 2 ? 4 : 2);
        suma += w * (1 - pnorm(c * s)) * dchiEsc(s, df);
      }
      return suma * h / 3;
    }
    var cacheQt = {};
    function qtSup(p, df) {
      var k = p + "|" + df;
      if (cacheQt[k]) return cacheQt[k];
      var lo = 0, hi = 80;
      for (var i = 0; i < 50; i++) { var m = (lo + hi) / 2; if (colaT(m, df) > p) lo = m; else hi = m; }
      return (cacheQt[k] = (lo + hi) / 2);
    }

    // --- simulación ---
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    var rnd = mulberry32(2026);
    function rnorm() {
      var u = 0;
      while (u === 0) u = rnd();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd());
    }
    var PROCESOS = {
      normal: { mu: 50, gen: function () { return 50 + 2.5 * rnorm(); }, rango: [45, 55], unidad: "µm" },
      expo: { mu: 8, gen: function () { return -8 * Math.log(1 - rnd()); }, rango: [0, 20], unidad: "min" },
    };

    var $ = function (id) { return document.getElementById(id); };
    var lote = [], total = 0, cubren = 0;

    function tomar() {
      var p = PROCESOS[$("pob").value];
      var n = Number($("n").value), nivel = Number($("nivel").value);
      var t = qtSup((1 - nivel) / 2, n - 1);
      lote = [];
      for (var r = 0; r < 100; r++) {
        var xs = [], s = 0;
        for (var j = 0; j < n; j++) { var x = p.gen(); xs.push(x); s += x; }
        var m = s / n, ss = 0;
        xs.forEach(function (x) { ss += (x - m) * (x - m); });
        var sd = Math.sqrt(ss / (n - 1)), e = t * sd / Math.sqrt(n);
        var ok = m - e <= p.mu && p.mu <= m + e;
        lote.push({ m: m, lo: m - e, hi: m + e, ok: ok });
      }
      var aciertos = lote.filter(function (l) { return l.ok; }).length;
      total += 100; cubren += aciertos;
      $("s-lote").textContent = aciertos + " / 100";
      $("s-acum").textContent = cubren + " / " + total + " · " + (100 * cubren / total).toFixed(1) + " %";
      $("s-fallos").textContent = String(total - cubren);
      var nominal = Math.round(nivel * 100);
      var pct = 100 * cubren / total;
      var nota = "Nivel nominal: <strong>" + nominal + " %</strong>. Un intervalo concreto contiene a μ o no; la confianza es del <strong>procedimiento</strong>: la fracción de intervalos que aciertan a la larga.";
      if ($("pob").value === "expo" && n < 30) nota += " Con datos asimétricos y n = " + n + ", la cobertura real suele quedar <strong>por debajo</strong> de la nominal: la t es robusta, pero no milagrosa.";
      else if (total >= 500 && Math.abs(pct - nominal) < 1.5) nota += " Con " + total + " intervalos, la cobertura observada ya está muy cerca de la nominal.";
      $("nota").innerHTML = nota;
      dibujar();
    }

    function reiniciar() { total = 0; cubren = 0; tomar(); }

    function color(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

    function dibujar() {
      var c = $("c"), dpr = window.devicePixelRatio || 1;
      var w = c.clientWidth, h = c.clientHeight;
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
      var ctx = c.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      var p = PROCESOS[$("pob").value];
      var a = p.rango[0], b = p.rango[1], izq = 8, der = 8, arr = 6, abj = 22;
      var X = function (x) { return izq + ((Math.min(b, Math.max(a, x)) - a) / (b - a)) * (w - izq - der); };
      var paso = (h - arr - abj) / lote.length;
      lote.forEach(function (l, i) {
        var y = arr + (i + 0.5) * paso;
        ctx.strokeStyle = l.ok ? color("--info") : color("--err");
        ctx.globalAlpha = l.ok ? 0.7 : 1;
        ctx.lineWidth = l.ok ? 1.5 : 2;
        ctx.beginPath(); ctx.moveTo(X(l.lo), y); ctx.lineTo(X(l.hi), y); ctx.stroke();
        ctx.fillStyle = ctx.strokeStyle;
        ctx.fillRect(X(l.m) - 1, y - 1.5, 2, 3);
      });
      ctx.globalAlpha = 1;
      ctx.strokeStyle = color("--accent"); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(X(p.mu), arr); ctx.lineTo(X(p.mu), h - abj); ctx.stroke();
      ctx.strokeStyle = color("--line"); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(izq, h - abj + 0.5); ctx.lineTo(w - der, h - abj + 0.5); ctx.stroke();
      ctx.fillStyle = color("--muted"); ctx.font = "11px " + color("--mono");
      ctx.textAlign = "left"; ctx.fillText(a + " " + p.unidad, izq, h - 6);
      ctx.textAlign = "right"; ctx.fillText(b + " " + p.unidad, w - der, h - 6);
      ctx.fillStyle = color("--accent"); ctx.textAlign = "center"; ctx.fillText("μ = " + p.mu, X(p.mu), h - 6);
    }

    $("mas").addEventListener("click", tomar);
    $("reiniciar").addEventListener("click", reiniciar);
    ["pob", "nivel"].forEach(function (id) { $(id).addEventListener("change", reiniciar); });
    $("n").addEventListener("input", function () { $("n-v").textContent = $("n").value; reiniciar(); });
    window.addEventListener("resize", dibujar);
    reiniciar();
  </script>
</body>
</html>
